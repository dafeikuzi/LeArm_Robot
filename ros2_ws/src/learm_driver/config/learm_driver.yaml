learm_driver:
  ros__parameters:
    calibration_enabled: true
    calibration_mode_enabled: false
    calibration_min_duration_ms: 200
    calibration_max_duration_ms: 1000
    ack_timeout_ms: 30000
    serial_send_service: /serial_controller/send_hex
    serial_received_topic: /serial_controller/received_hex

    gripper.id: 1
    gripper.open_pulse_us: 500
    gripper.closed_pulse_us: 1400

    joint_1.id: 1
    joint_1.calibration_min_pulse_us: 500
    joint_1.calibration_max_pulse_us: 1400

    joint_2.id: 2
    joint_2.min_position_rad: -1.57079632679
    joint_2.max_position_rad: 1.57079632679
    joint_2.pulse_at_min_position_us: 500
    joint_2.pulse_at_max_position_us: 2500
    joint_2.calibration_min_pulse_us: 500
    joint_2.calibration_max_pulse_us: 2500

    joint_3.id: 3
